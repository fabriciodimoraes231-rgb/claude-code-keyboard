; Projeto: Teclado Claude Code (3 teclas) - ESP32-C3-Supermini
; Atua como teclado Bluetooth (BLE HID), pois o ESP32-C3 nao tem
; USB OTG nativo (nao consegue ser um teclado USB HID de verdade).

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Mantem o Serial disponivel pela porta USB-C (util para debug via monitor).
; USE_NIMBLE troca o backend Bluetooth de Bluedroid (instavel no C3) para
; NimBLE, que e o backend recomendado pela propria lib para ESP32-C3/S3.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USE_NIMBLE

; ESP32-BLE-Keyboard esta vendorizada em lib/ (com correcao para
; reiniciar o advertising apos desconexao no backend NimBLE), por isso
; nao entra aqui via lib_deps.
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
